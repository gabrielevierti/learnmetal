<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-label="Features: From a triangle to PBR: Over 50 chapters in a classic path: getting started, lighting, models, advanced techniques, PBR.; Swift or C++: Switch the host language in the top bar: MetalKit in Swift, or Apple's metal-cpp with GLFW.; Live demos in the browser: Edit real Metal Shading Language and see it run, translated on the fly for any platform.; Runnable examples: 17 Swift example apps and a C++ starter, downloadable as zips or straight from the repo.; Exercises with solutions: Most chapters end with exercises, and their solutions are written up on the site.; Coming from OpenGL?: Boxes that map OpenGL, Vulkan and Direct3D habits to Metal along the way."><title>Features: From a triangle to PBR: Over 50 chapters in a classic path: getting started, lighting, models, advanced techniques, PBR.; Swift or C++: Switch the host language in the top bar: MetalKit in Swift, or Apple's metal-cpp with GLFW.; Live demos in the browser: Edit real Metal Shading Language and see it run, translated on the fly for any platform.; Runnable examples: 17 Swift example apps and a C++ starter, downloadable as zips or straight from the repo.; Exercises with solutions: Most chapters end with exercises, and their solutions are written up on the site.; Coming from OpenGL?: Boxes that map OpenGL, Vulkan and Direct3D habits to Metal along the way.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#0969da;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#afb8c1;stroke-width:1;stroke-linecap:round}
